version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Tests may use weak randomness, ignore close errors, and hardcode values.
      - path: _test\.go
        linters: [gosec, errcheck, bodyclose]
      # testkeys is test support code.
      - path: internal/testkeys/
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/gesparza8138/aws-messaging-mcp
