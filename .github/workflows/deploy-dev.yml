name: deploy-dev

# Manual-dispatch only during M0/M1 so every dev deploy is a deliberate,
# reviewed action (see PRD Appendix C). Flipping the trigger to push-on-main
# is a one-line change planned for M2. Run once with execute=false to build
# the artifact and print the change-set summary; run with execute=true to
# apply it.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the change set (false = create and summarize only)
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: build artifact (static arm64 bootstrap binary)
        id: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/server
          zip -qj app.zip bootstrap
          echo "key=app-$(sha256sum app.zip | cut -c1-16).zip" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-dev-${{ github.run_id }}
          mask-aws-account-id: true

      - name: upload artifact
        run: aws s3 cp app.zip "s3://${{ secrets.ARTIFACT_BUCKET }}/${{ steps.build.outputs.key }}"

      - name: fetch stage secrets from SSM
        id: secrets
        run: |
          OS=$(aws ssm get-parameter --name /messaging-mcp/dev/origin-secret --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$OS"
          echo "origin_secret=$OS" >> "$GITHUB_OUTPUT"
          BG=$(aws ssm get-parameter --name /messaging-mcp/dev/break-glass-sha256 --query Parameter.Value --output text)
          echo "::add-mask::$BG"
          echo "break_glass_sha256=$BG" >> "$GITHUB_OUTPUT"
          echo "allowed_cidrs=$(aws ssm get-parameter --name /messaging-mcp/edge/allowed-cidrs --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          # Empty until the shared eum stack exists; the /opt-in page copes.
          echo "opt_in_number=$(aws ssm get-parameter --name /messaging-mcp/eum/phone-number --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "eum_phone_arn=$(aws ssm get-parameter --name /messaging-mcp/eum/phone-arn --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "eum_protect_id=$(aws ssm get-parameter --name /messaging-mcp/eum/protect-configuration-id --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          {
            echo "files_pem<<PEMEOF"
            aws ssm get-parameter --name /messaging-mcp/dev/files-public-key-pem --query Parameter.Value --output text 2>/dev/null || true
            echo "PEMEOF"
          } >> "$GITHUB_OUTPUT"

      - name: create change set
        id: changeset
        run: |
          # A JSON parameter file sidesteps the CLI's Key=Value parser, which
          # mangles values containing commas (the CIDR list).
          jq -n --slurpfile base <(jq '[.[] | split("=") | {ParameterKey: .[0], ParameterValue: (.[1:] | join("="))}]' infra/params/dev.json) \
            --arg key "${{ steps.build.outputs.key }}" \
            --arg os "${{ steps.secrets.outputs.origin_secret }}" \
            --arg bg "${{ steps.secrets.outputs.break_glass_sha256 }}" \
            --arg cidrs "${{ steps.secrets.outputs.allowed_cidrs }}" \
            --arg optin "${{ steps.secrets.outputs.opt_in_number }}" \
            --arg phonearn "${{ steps.secrets.outputs.eum_phone_arn }}" \
            --arg protectid "${{ steps.secrets.outputs.eum_protect_id }}" \
            --arg filespem "${{ steps.secrets.outputs.files_pem }}" \
            '$base[0] + [
              {ParameterKey: "CodeKey", ParameterValue: $key},
              {ParameterKey: "OriginSecret", ParameterValue: $os},
              {ParameterKey: "BreakGlassSha256", ParameterValue: $bg},
              {ParameterKey: "AllowedCidrs", ParameterValue: $cidrs},
              {ParameterKey: "OptInPhoneNumber", ParameterValue: $optin},
              {ParameterKey: "OriginationPhoneArn", ParameterValue: $phonearn},
              {ParameterKey: "ProtectConfigurationId", ParameterValue: $protectid},
              {ParameterKey: "FilesPublicKeyPem", ParameterValue: ($filespem | rtrimstr("\n"))}
            ]' > params.json
          # Dev only: the owner's test phone joins the recipient allow-list at
          # deploy time so it never appears in the repo (public-repo hygiene).
          if [ -n "${{ secrets.E2E_TEST_PHONE }}" ]; then
            jq --arg phone "${{ secrets.E2E_TEST_PHONE }}" \
              'map(if .ParameterKey == "RecipientAllowList" then .ParameterValue += "," + $phone else . end)' \
              params.json > params.tmp && mv params.tmp params.json
          fi
          aws cloudformation deploy \
            --stack-name aws-messaging-mcp-dev \
            --template-file infra/app.yaml \
            --role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-messaging-mcp-cfn-service" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-execute-changeset \
            --parameter-overrides file://params.json
          ARN=$(aws cloudformation list-change-sets --stack-name aws-messaging-mcp-dev \
            --query 'Summaries | sort_by(@, &CreationTime) | [-1].ChangeSetId' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          {
            echo "## Change set for aws-messaging-mcp-dev"
            echo '```'
            aws cloudformation describe-change-set --change-set-name "$ARN" \
              --query 'Changes[].{Action:ResourceChange.Action,LogicalId:ResourceChange.LogicalResourceId,Type:ResourceChange.ResourceType,Replacement:ResourceChange.Replacement}' \
              --output table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: execute change set
        if: inputs.execute
        run: |
          aws cloudformation execute-change-set --change-set-name "${{ steps.changeset.outputs.arn }}"
          # Poll the stack directly: the create/update waiters do not fail on
          # each other's terminal states and would block for up to an hour.
          for _ in $(seq 1 120); do
            STATUS=$(aws cloudformation describe-stacks --stack-name aws-messaging-mcp-dev \
              --query 'Stacks[0].StackStatus' --output text)
            case "$STATUS" in
              CREATE_COMPLETE|UPDATE_COMPLETE) break ;;
              *IN_PROGRESS) sleep 15 ;;
              *) echo "stack ended in $STATUS"; exit 1 ;;
            esac
          done
          [ "$STATUS" = "CREATE_COMPLETE" ] || [ "$STATUS" = "UPDATE_COMPLETE" ] || { echo "timed out in $STATUS"; exit 1; }
          aws cloudformation describe-stacks --stack-name aws-messaging-mcp-dev \
            --query 'Stacks[0].Outputs' --output table >> "$GITHUB_STEP_SUMMARY"

      - name: discard unexecuted change set
        if: ${{ !inputs.execute }}
        run: echo "Change set left pending; re-run with execute=true to apply, or delete it in the console." >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e-dev
    needs: deploy
    if: ${{ inputs.execute }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: admit runner ip to the edge allow-list
        run: ./scripts/e2e-allowlist.sh add

      - name: run e2e suite
        run: |
          OUT=$(aws cloudformation describe-stacks --stack-name aws-messaging-mcp-dev \
            --query 'Stacks[0].Outputs' --output json)
          get() { echo "$OUT" | jq -r ".[] | select(.OutputKey==\"$1\").OutputValue"; }
          E2E_BASE_URL=$(get McpUrl | sed 's|/mcp/$||')
          E2E_TOKEN_URL="$(get HostedUiUrl)/oauth2/token"
          E2E_CLIENT_ID=$(aws ssm get-parameter --name /messaging-mcp/dev/ci-client-id \
            --query Parameter.Value --output text)
          E2E_CLIENT_SECRET=$(aws ssm get-parameter --name /messaging-mcp/dev/ci-client-secret \
            --with-decryption --query Parameter.Value --output text)
          param() { jq -r ".[] | select(startswith(\"$1=\"))" infra/params/dev.json | cut -d= -f2-; }
          E2E_SENDER=$(param SesSenderAddresses | cut -d, -f1)
          E2E_RECIPIENT=$(param RecipientAllowList | cut -d, -f1)
          export E2E_BASE_URL E2E_TOKEN_URL E2E_CLIENT_ID E2E_CLIENT_SECRET E2E_SENDER E2E_RECIPIENT
          export E2E_CONFIG_SET=aws-messaging-mcp-dev
          export E2E_EVENTS_LOG_GROUP=/aws-messaging-mcp/dev/ses-events
          export E2E_TEST_PHONE="${{ secrets.E2E_TEST_PHONE }}"
          export E2E_ORIGINATION=$(aws ssm get-parameter --name /messaging-mcp/eum/phone-number \
            --query Parameter.Value --output text 2>/dev/null || true)
          export E2E_SMS_CONFIG_SET=aws-messaging-mcp-dev-sms
          export E2E_EUM_LOG_GROUP=/aws-messaging-mcp/dev/eum-events
          # The republished edge function propagates in seconds, but poll
          # rather than assume: healthz goes through the allow-list too.
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$E2E_BASE_URL/healthz")
            [ "$code" = "200" ] && break
            sleep 5
          done
          go test -tags e2e -count=1 -v ./e2e/

      - name: withdraw runner ip
        if: always()
        run: ./scripts/e2e-allowlist.sh remove
