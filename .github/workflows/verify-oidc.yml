name: verify-oidc

# Manually-dispatched proof that GitHub -> AWS OIDC federation works and that
# the prod environment gate holds:
#   - the dev job must print the dev deploy role's identity
#   - the prod job dispatched from main must be REJECTED by the environment's
#     tag-only deployment branch policy; dispatched from a v* tag it must wait
#     for the required reviewer before running
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev:
    name: verify-oidc-dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: verify-oidc-${{ github.run_id }}
          mask-aws-account-id: true
      - run: aws sts get-caller-identity

  prod:
    name: verify-oidc-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: verify-oidc-${{ github.run_id }}
          mask-aws-account-id: true
      - run: aws sts get-caller-identity
