name: docs

# Carries the required "docs" status check, so it must run on every PR -
# do not add path filters (a filtered-out required check blocks merging).
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly external-link sweep; kept off the PR path so rate-limit flakes
    # never block merges (M5 §1.4).
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: tool-docs drift
        # docs/tools/*.md are rendered from the live tool registry; a page
        # that differs from what gendocs would emit fails the build.
        run: go run ./cmd/gendocs -check
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"
      - name: lychee (relative links, offline)
        # Offline mode checks every relative link and file reference in the
        # repo deterministically; external-URL checking is deferred (flaky in
        # CI due to rate limits) and revisited in M5 hardening.
        run: |
          docker run --rm -v "$PWD:/input" -w /input lycheeverse/lychee:0.24.2 \
            --offline --no-progress --root-dir /input "./**/*.md"

  external-links:
    name: external-links
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: lychee (external URLs)
        run: |
          docker run --rm -v "$PWD:/input" -w /input lycheeverse/lychee:0.24.2 \
            --no-progress --root-dir /input --max-retries 2 \
            --exclude "amazonses|awsapps|cloudfront-signed" "./**/*.md"
