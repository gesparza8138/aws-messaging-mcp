name: release

# Prod path (PRD 10): a signed v* tag builds the artifact, publishes a GitHub
# Release with it attached, then waits on the `prod` environment's required
# reviewer before deploying. Prod is never deployed from a workstation.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      key: ${{ steps.build.outputs.key }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: build artifact (static arm64 bootstrap binary)
        id: build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/server
          zip -qj app.zip bootstrap
          echo "key=app-$(sha256sum app.zip | cut -c1-16).zip" >> "$GITHUB_OUTPUT"
      - name: publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app.zip "${{ steps.build.outputs.key }}"
          gh release create "${{ github.ref_name }}" "${{ steps.build.outputs.key }}" \
            --title "${{ github.ref_name }}" --generate-notes

  deploy-prod:
    name: deploy-prod
    needs: release
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: fetch the released artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ github.ref_name }}" --pattern "${{ needs.release.outputs.key }}"
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: release-${{ github.run_id }}
          mask-aws-account-id: true
      - name: upload artifact
        run: aws s3 cp "${{ needs.release.outputs.key }}" "s3://${{ secrets.ARTIFACT_BUCKET }}/${{ needs.release.outputs.key }}"
      - name: fetch stage secrets from SSM
        id: secrets
        run: |
          OS=$(aws ssm get-parameter --name /messaging-mcp/prod/origin-secret --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$OS"
          echo "origin_secret=$OS" >> "$GITHUB_OUTPUT"
          BG=$(aws ssm get-parameter --name /messaging-mcp/prod/break-glass-sha256 --query Parameter.Value --output text)
          echo "::add-mask::$BG"
          echo "break_glass_sha256=$BG" >> "$GITHUB_OUTPUT"
          echo "allowed_cidrs=$(aws ssm get-parameter --name /messaging-mcp/edge/allowed-cidrs --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          # Empty until the shared eum stack exists; the /opt-in page copes.
          echo "opt_in_number=$(aws ssm get-parameter --name /messaging-mcp/eum/phone-number --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "eum_phone_arn=$(aws ssm get-parameter --name /messaging-mcp/eum/phone-arn --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "eum_protect_id=$(aws ssm get-parameter --name /messaging-mcp/eum/protect-configuration-id --query Parameter.Value --output text 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          {
            echo "files_pem<<PEMEOF"
            aws ssm get-parameter --name /messaging-mcp/prod/files-public-key-pem --query Parameter.Value --output text 2>/dev/null || true
            echo "PEMEOF"
          } >> "$GITHUB_OUTPUT"
          echo "files_key_fp=$(aws ssm get-parameter --name /messaging-mcp/prod/files-public-key-pem --query Parameter.Value --output text 2>/dev/null | sha256sum | cut -c1-12 || true)" >> "$GITHUB_OUTPUT"
          echo "files_key_slot=$(aws ssm get-parameter --name /messaging-mcp/prod/files-key-slot --query Parameter.Value --output text 2>/dev/null || echo a)" >> "$GITHUB_OUTPUT"
      - name: deploy
        run: |
          # A JSON parameter file sidesteps the CLI's Key=Value parser, which
          # mangles values containing commas (the CIDR list).
          jq -n --slurpfile base <(jq '[.[] | split("=") | {ParameterKey: .[0], ParameterValue: (.[1:] | join("="))}]' infra/params/prod.json) \
            --arg key "${{ needs.release.outputs.key }}" \
            --arg os "${{ steps.secrets.outputs.origin_secret }}" \
            --arg bg "${{ steps.secrets.outputs.break_glass_sha256 }}" \
            --arg cidrs "${{ steps.secrets.outputs.allowed_cidrs }}" \
            --arg optin "${{ steps.secrets.outputs.opt_in_number }}" \
            --arg phonearn "${{ steps.secrets.outputs.eum_phone_arn }}" \
            --arg protectid "${{ steps.secrets.outputs.eum_protect_id }}" \
            --arg filespem "${{ steps.secrets.outputs.files_pem }}" \
            --arg fileskeyfp "${{ steps.secrets.outputs.files_key_fp }}" \
            --arg fileskeyslot "${{ steps.secrets.outputs.files_key_slot }}" \
            '$base[0] + [
              {ParameterKey: "CodeKey", ParameterValue: $key},
              {ParameterKey: "OriginSecret", ParameterValue: $os},
              {ParameterKey: "BreakGlassSha256", ParameterValue: $bg},
              {ParameterKey: "AllowedCidrs", ParameterValue: $cidrs},
              {ParameterKey: "OptInPhoneNumber", ParameterValue: $optin},
              {ParameterKey: "OriginationPhoneArn", ParameterValue: $phonearn},
              {ParameterKey: "ProtectConfigurationId", ParameterValue: $protectid},
              {ParameterKey: "FilesPublicKeyPem", ParameterValue: ($filespem | rtrimstr("\n"))},
              {ParameterKey: "FilesKeyFingerprint", ParameterValue: $fileskeyfp},
              {ParameterKey: "FilesKeySlot", ParameterValue: $fileskeyslot}
            ]' > params.json
          aws cloudformation deploy \
            --stack-name aws-messaging-mcp-prod \
            --template-file infra/app.yaml \
            --role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/aws-messaging-mcp-cfn-service" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides file://params.json
          aws cloudformation describe-stacks --stack-name aws-messaging-mcp-prod \
            --query 'Stacks[0].Outputs' --output table >> "$GITHUB_STEP_SUMMARY"
      - name: smoke test
        # Runners are not in the edge allow-list, so the public hostname must
        # answer 403 from the CloudFront Function (proves the gate), and the
        # application contracts are checked through the origin-secret path.
        run: |
          URL=$(aws cloudformation describe-stacks --stack-name aws-messaging-mcp-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`McpUrl`].OutputValue' --output text)
          BASE=${URL%/mcp/}
          code=$(curl -s -o /tmp/edge.json -w '%{http_code}' "$BASE/healthz")
          [ "$code" = "403" ] && grep -q '"forbidden"' /tmp/edge.json || { echo "edge gate: expected 403 forbidden, got $code"; exit 1; }
          echo "edge gate OK (runner blocked)"
          FN=$(aws cloudformation describe-stacks --stack-name aws-messaging-mcp-prod \
            --query 'Stacks[0].Outputs[?OutputKey==`FunctionUrl`].OutputValue' --output text)
          echo "::add-mask::$FN"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Origin-Secret: ${{ steps.secrets.outputs.origin_secret }}" "${FN}healthz") && [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "healthz via origin returned $code"; exit 1; }
          curl -sf -H "X-Origin-Secret: ${{ steps.secrets.outputs.origin_secret }}" "${FN}.well-known/oauth-protected-resource" | jq -e --arg u "$URL" '.resource == $u' >/dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Origin-Secret: ${{ steps.secrets.outputs.origin_secret }}" -H 'content-type: application/json' -d '{}' "${FN}mcp/")
          [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; exit 1; }
          echo "smoke OK: $URL"
