repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # CloudFormation intrinsic tags (!Ref, !GetAtt) are not plain YAML.
        exclude: ^infra/
      - id: check-added-large-files
      - id: check-merge-conflict

  # Go tooling runs from the local toolchain so hooks, CI, and editors agree.
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
