repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # CloudFormation intrinsic tags (!Ref, !GetAtt) are not plain YAML.
        exclude: ^infra/
      - id: check-added-large-files
      - id: check-merge-conflict

  # ruff runs from the project venv so pre-commit, CI, and editors all use the
  # locked version - no drift between the hook mirror and uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
