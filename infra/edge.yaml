AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-messaging-mcp edge stack (us-east-1): Route 53 hosted zone for the
  delegated subdomain, ACM certificate for CloudFront, and the WAF WebACL
  with the default-deny IP allow-list and the /files/* exemption. Deployed
  once; shared by the dev and prod app stacks.

Parameters:
  DomainName:
    Type: String
    Default: mcp.gabriel-esparza.com
    Description: Delegated subdomain; the hosted zone apex.

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    # Never let an unrelated stack failure destroy the delegation - the NS
    # values are pinned at GoDaddy and a recreated zone gets different ones.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Delegated from GoDaddy for aws-messaging-mcp; see docs/setup/dns.md.

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_71
            comment: Deliberate PRD 9.1 design - one certificate covers the prod apex and the dev subdomain via the wildcard SAN.
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub "*.${DomainName}"
      ValidationMethod: DNS
      # One entry only: the wildcard SAN shares the apex's validation CNAME,
      # and listing both makes CloudFormation create the identical record
      # twice in one change batch, which Route 53 rejects (observed 400
      # "invalid set of changes for a resource record set").
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZone
      KeyAlgorithm: RSA_2048

  # The flat-rate Free plan requires a web ACL on the subscribed distribution
  # but supports only managed rules, rate limiting, and geo blocking - not the
  # IP-set allow-list or path match this design needs. The ACL is therefore
  # empty (default allow) and exists for plan eligibility; the default-deny
  # IP allow-list with the /files/* exemption is a CloudFront Function on
  # viewer-request in app.yaml (allow-list in SSM /messaging-mcp/edge/allowed-cidrs).
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Metadata:
      checkov:
        skip:
          - id: CKV2_AWS_31
            comment: WAF logging is a paid-tier plan feature; deferred to M5.
          - id: CKV_AWS_192
            comment: Managed rule groups evaluated in M5 against the Free tier's 5-rule allowance; access control is the viewer-request function plus OAuth.
    Properties:
      Name: aws-messaging-mcp-edge
      Description: Empty web ACL required for flat-rate plan eligibility. Access control lives in the CloudFront Function.
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: aws-messaging-mcp-edge
        SampledRequestsEnabled: true
      Rules: []

Outputs:
  HostedZoneId:
    Description: Route 53 zone for the delegated subdomain; app stacks write records here.
    Value: !Ref HostedZone
  NameServers:
    Description: Add these four NS records for host "mcp" at GoDaddy (docs/setup/dns.md section 2).
    Value: !Join [", ", !GetAtt HostedZone.NameServers]
  CertificateArn:
    Description: ACM certificate (apex + wildcard) for the CloudFront distributions.
    Value: !Ref Certificate
  WebAclArn:
    Description: WAF WebACL to attach to the CloudFront distributions.
    Value: !GetAtt WebAcl.Arn
