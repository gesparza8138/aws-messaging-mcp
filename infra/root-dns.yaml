AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Route 53 hosted zone for the root domain gabriel-esparza.com. DNS hosting
  for the whole domain moves here from GoDaddy (registration stays at
  GoDaddy; only the nameservers change). Delegates mcp.<domain> to the
  project zone the edge stack owns and keeps the www CNAME; the apex A/AAAA
  records belong to the apex-site stack, which 301s the apex to the mcp
  landing page. Deployed once, manually, like the edge stack.

Parameters:
  DomainName:
    Type: String
    Default: gabriel-esparza.com
    Description: Root domain name.
  McpZoneNameServers:
    Type: CommaDelimitedList
    Description: >-
      The four name servers of the existing mcp.<domain> hosted zone
      (edge-stack output NameServers). Passed at deploy time so recreating
      the child zone never requires a template change.

Resources:
  RootZone:
    Type: AWS::Route53::HostedZone
    # The domain's nameservers at the GoDaddy registrar point at this zone;
    # a stack failure must never destroy it.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: Whole-domain DNS hosting, moved from GoDaddy 2026-08. Registration remains at GoDaddy.

  McpDelegation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RootZone
      Name: !Sub mcp.${DomainName}
      Type: NS
      TTL: "3600"
      ResourceRecords: !Ref McpZoneNameServers

  # Deliberately still a CNAME to the apex, which chains to the apex-site
  # stack's alias records. Converting it to an A alias in place would make
  # CloudFormation create the A before deleting the CNAME, and Route 53
  # rejects two record types on one name in a single change batch.
  WwwCname:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref RootZone
      Name: !Sub www.${DomainName}
      Type: CNAME
      TTL: "3600"
      ResourceRecords:
        - !Ref DomainName

Outputs:
  RootZoneId:
    Description: Hosted zone id for the root domain.
    Value: !Ref RootZone
  RootNameServers:
    Description: Set these four values as the domain's nameservers at the GoDaddy registrar.
    Value: !Join [", ", !GetAtt RootZone.NameServers]
