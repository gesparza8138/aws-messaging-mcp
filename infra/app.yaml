AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  aws-messaging-mcp app stack, M1 subset: Cognito user pool + app clients,
  Lambda (Web Adapter) serving the MCP app, CloudFront distribution with the
  edge WAF, and DNS records. Messaging resources (SES, EUM, buckets,
  DynamoDB, scheduler, budget) arrive with M2-M4b. Deployed only via the
  deploy-dev/release workflows using the CloudFormation service role; edge
  values are resolved from SSM (/messaging-mcp/edge/*) so no ARNs live in
  the repo.

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
  DomainName:
    Type: String
    Default: mcp.gabriel-esparza.com
    Description: Delegated subdomain; prod serves the apex, dev serves dev.<domain>.
  CodeKey:
    Type: String
    Description: Artifact-bucket key of the application zip (content-hash keyed).
  CognitoDomainPrefix:
    Type: String
    AllowedPattern: ^(?!.*(aws|amazon|cognito))[a-z0-9-]{1,63}$
    Description: >-
      Globally unique Cognito hosted-UI domain prefix for this stage. Cognito
      rejects prefixes containing "aws", "amazon", or "cognito".
  AuthMetadataMode:
    Type: String
    AllowedValues: [direct, fronted]
    Default: direct
    Description: >-
      direct advertises the Cognito issuer as authorization server; fronted
      advertises this host, whose RFC 8414 document adds
      code_challenge_methods_supported (PRD R2 mitigation).
  OriginSecret:
    Type: String
    NoEcho: true
    Description: >-
      X-Origin-Secret value CloudFront injects toward the Function URL. The
      deploy workflow reads it from SSM SecureString
      /messaging-mcp/<stage>/origin-secret (rotate with cmd/ops rotate-secret);
      never committed.
  BreakGlassEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Static-bearer fallback; PRD S10 keeps it off in prod by default.
  BreakGlassSha256:
    Type: String
    NoEcho: true
    Default: ""
    Description: Hex SHA-256 of the break-glass token (never the token itself).
  AlarmEmail:
    Type: String
    Default: esparza.gabriel@gmail.com
    Description: SNS subscription for operational alarms.
  SesSenderAddresses:
    Type: String
    Description: Comma-separated sender allow-list for this stage (PRD 8).
  SesReplyTo:
    Type: String
    Default: esparza.gabriel@gmail.com
    Description: Default Reply-To injected when the caller omits one.
  OptInPhoneNumber:
    Type: String
    Default: ""
    Description: >-
      Public toll-free number shown on /opt-in (E.164). The deploy workflows
      read it from SSM /messaging-mcp/eum/phone-number once the eum stack
      exists; empty renders a generic phrase. Kept out of the repo.
  RecipientAllowList:
    Type: String
    Default: ""
    Description: Comma-separated recipient allow-list; empty disables (prod).
  RateLimitPerHour:
    Type: Number
    Default: 20
  RateLimitPerDay:
    Type: Number
    Default: 300
  MaxRecipients:
    Type: Number
    Default: 10
  SmsMaxPrice:
    Type: String
    Default: "0.05"
    Description: Per-message USD ceiling for SMS/MMS (PRD 8).
  OriginationPhoneArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the shared toll-free number. The deploy workflows read it from
      SSM /messaging-mcp/eum/phone-arn once the eum stack exists; while empty
      the SMS tools stay unregistered and no send permission is granted.
  ProtectConfigurationId:
    Type: String
    Default: ""
    Description: Read from SSM /messaging-mcp/eum/protect-configuration-id.
  FilesKeySlot:
    Type: String
    AllowedValues: [a, b]
    Default: a
    Description: >-
      Which of the two public-key slots is active. cmd/ops rotate-signing-key
      toggles it (SSM /messaging-mcp/<stage>/files-key-slot); the flip makes
      CloudFormation create the new slot's key, repoint the key group, and
      delete the old one - the only pure-CFN way to rotate, because the
      resource has no create-only properties and in-place EncodedKey updates
      are invalid (M5 finding).
  FilesKeyFingerprint:
    Type: String
    Default: ""
    Description: >-
      Short digest of FilesPublicKeyPem, computed by the deploy workflows.
      Baked into the public key's CallerReference so a rotated PEM REPLACES
      the CloudFront public key (EncodedKey is immutable in place - M5
      finding); the key group and Lambda env follow the new id in the same
      deploy.
  FilesPublicKeyPem:
    Type: String
    Default: ""
    Description: >-
      CloudFront signing public key (PEM). The deploy workflows read it from
      SSM /messaging-mcp/<stage>/files-public-key-pem once cmd/ops
      rotate-signing-key has run; while empty the files behavior, key group,
      and tools stay off (M4b-2).
  FilesMaxExpiryDays:
    Type: Number
    Default: 365
  FilesMaxUploadBytes:
    Type: Number
    Default: 524288000
  FilesQuotaBytes:
    Type: Number
    Default: 5368709120
    Description: Total-bucket quota backstop (PRD 8); dev 5 GB, prod 20 GB via params.
  AllowRiskyContentTypes:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Dev-only bypass of the files content-type deny-list.
  AllowedCidrs:
    Type: String
    Description: >-
      Comma-separated IPv4 CIDRs allowed to reach everything except /files/*
      (Anthropic egress plus owner IPs). The deploy workflows read it from SSM
      /messaging-mcp/edge/allowed-cidrs; scripts/update-my-ip.sh maintains it.
  ReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
    Description: >-
      Blast-radius cap (PRD S8). 0 disables the reservation: accounts with the
      small default Lambda concurrency quota cannot reserve any without
      dropping the unreserved pool below Lambda's minimum of 10. Set to 5
      once the account quota has been raised.

Conditions:
  IsProd: !Equals [!Ref Stage, prod]
  IsDev: !Not [!Equals [!Ref Stage, prod]]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, 0]]
  HasEumPhone: !Not [!Equals [!Ref OriginationPhoneArn, ""]]
  HasProtectConfig: !Not [!Equals [!Ref ProtectConfigurationId, ""]]
  HasFilesKey: !Not [!Equals [!Ref FilesPublicKeyPem, ""]]
  UseKeySlotA: !And [!Condition HasFilesKey, !Equals [!Ref FilesKeySlot, a]]
  UseKeySlotB: !And [!Condition HasFilesKey, !Equals [!Ref FilesKeySlot, b]]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub aws-messaging-mcp-${Stage}
      UserPoolTier: ESSENTIALS
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 16
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: msg
      Name: msg
      UserPoolId: !Ref UserPool
      Scopes:
        - { ScopeName: read, ScopeDescription: Read-only discovery tools }
        - { ScopeName: "email:send", ScopeDescription: Send email via SES }
        - { ScopeName: "sms:send", ScopeDescription: Send SMS/MMS }
        - { ScopeName: "rcs:send", ScopeDescription: Send RCS }
        - { ScopeName: "files:write", ScopeDescription: Upload and share files }

  ClaudeHostedClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: claude-hosted
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - msg/read
        - msg/email:send
        - msg/sms:send
        - msg/rcs:send
        - msg/files:write
      CallbackURLs:
        # Anthropic's hosted bridge redirects to either domain.
        - https://claude.ai/api/mcp/auth_callback
        - https://claude.com/api/mcp/auth_callback
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  ClaudeCodeClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: claude-code
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - msg/read
        - msg/email:send
        - msg/sms:send
        - msg/rcs:send
        - msg/files:write
      CallbackURLs:
        # Cognito matches redirect URIs exactly, port included (PRD 6.2).
        - http://localhost:8765/callback
        - http://127.0.0.1:8765/callback
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 365
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  # Confidential app client for CI e2e (PRD 11.3); dev only.
  CiClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: IsDev
    DependsOn: ResourceServer
    Properties:
      ClientName: ci
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      SupportedIdentityProviders: [COGNITO]
      # Machine auth: client_credentials is the only grant that issues access
      # tokens carrying resource-server scopes without a user (InitiateAuth
      # tokens carry only aws.cognito.signin.user.admin, and pool-wide MFA
      # would block a CI user anyway). openid is not allowed on this grant.
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [msg/read, msg/email:send, msg/sms:send, msg/files:write]
      AccessTokenValidity: 15
      TokenValidityUnits:
        AccessToken: minutes
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_28
            comment: Point-in-time recovery is pointless for ephemeral rate-limit counters that expire via TTL.
          - id: CKV_AWS_119
            comment: Default encryption suffices for counters holding only tool names and integers.
    Properties:
      TableName: !Sub aws-messaging-mcp-${Stage}-counters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  SesConfigurationSet:
    Type: AWS::SES::ConfigurationSet
    Properties:
      Name: !Sub aws-messaging-mcp-${Stage}

  SesEventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Properties:
      ConfigurationSetName: !Ref SesConfigurationSet
      EventDestination:
        Enabled: true
        MatchingEventTypes: [SEND, DELIVERY, BOUNCE, COMPLAINT, REJECT]
        EventBridgeDestination:
          EventBusArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  SesEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Default SSE suffices; events carry message ids and hashed metadata, not bodies (PRD S5).
    Properties:
      LogGroupName: !Sub /aws-messaging-mcp/${Stage}/ses-events
      RetentionInDays: !If [IsProd, 90, 14]

  SesEventsLogPolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub aws-messaging-mcp-${Stage}-ses-events
      PolicyDocument: !Sub |
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":["events.amazonaws.com","delivery.logs.amazonaws.com"]},"Action":["logs:CreateLogStream","logs:PutLogEvents"],"Resource":"${SesEventsLogGroup.Arn}"}]}

  SesEventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub aws-messaging-mcp-${Stage}-ses-events
      Description: SES sending events for this stage's configuration set to CloudWatch Logs.
      EventPattern:
        source: [aws.ses]
        detail:
          mail:
            tags:
              ses:configuration-set:
                - !Ref SesConfigurationSet
      Targets:
        - Id: log-group
          Arn: !GetAtt SesEventsLogGroup.Arn

  EumEventsLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Default SSE suffices; events carry message ids and delivery metadata, not bodies (PRD S5).
    Properties:
      LogGroupName: !Sub /aws-messaging-mcp/${Stage}/eum-events
      RetentionInDays: !If [IsProd, 90, 14]

  EumEventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub aws-messaging-mcp-${Stage}-eum-events
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sms-voice.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-events
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub ${EumEventsLogGroup.Arn}:*

  EumConfigurationSet:
    Type: AWS::SMSVOICE::ConfigurationSet
    Properties:
      ConfigurationSetName: !Sub aws-messaging-mcp-${Stage}-sms
      ProtectConfigurationId: !If [HasProtectConfig, !Ref ProtectConfigurationId, !Ref AWS::NoValue]
      EventDestinations:
        - EventDestinationName: cloudwatch-logs
          Enabled: true
          MatchingEventTypes: [ALL]
          CloudWatchLogsDestination:
            IamRoleArn: !GetAtt EumEventsRole.Arn
            LogGroupArn: !GetAtt EumEventsLogGroup.Arn

  MediaBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Access logging adds a second bucket for a private, single-writer media staging store; deferred.
          - id: CKV_AWS_21
            comment: Versioning on a 7-day-lifecycle staging bucket only re-bills deleted media; objects are disposable by design.
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: Media staging bucket is private, short-lived (7-day lifecycle), written only by the server.
    Properties:
      # Separate from the files bucket and never behind CloudFront (hard rule).
      BucketName: !Sub aws-messaging-mcp-media-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: expire-media
            Status: Enabled
            ExpirationInDays: 7
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FilesBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Access logging deferred to M5 with the rest of observability.
          - id: CKV_AWS_21
            comment: Versioning would resurrect "deleted = revoked" objects; delete-as-revoke is the R9 control.
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: Access logging deferred to M5; bucket is private behind OAC with signed URLs.
    Properties:
      # The ONLY bucket behind CloudFront (hard rule); everything else is
      # reachable solely by the Lambda role.
      BucketName: !Sub aws-messaging-mcp-files-${AWS::AccountId}-${Stage}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          # Presigned PUT uploads carry their own auth; the URL is the secret.
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: [content-type, content-length]
            MaxAge: 900
      LifecycleConfiguration:
        Rules:
          # Deletion is the cleanup task's job (per-object expires-at); only
          # abandoned multiparts age out here.
          - Id: abort-incomplete-multipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt FilesBucket.Arn
              - !Sub ${FilesBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: CloudFrontRead
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${FilesBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  FilesOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub aws-messaging-mcp-${Stage}-files
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SigningPublicKeyA:
    Type: AWS::CloudFront::PublicKey
    Condition: UseKeySlotA
    Properties:
      PublicKeyConfig:
        Name: !Sub aws-messaging-mcp-${Stage}-files-a
        CallerReference: !Sub aws-messaging-mcp-${Stage}-files-a-${FilesKeyFingerprint}
        EncodedKey: !Ref FilesPublicKeyPem

  SigningPublicKeyB:
    Type: AWS::CloudFront::PublicKey
    Condition: UseKeySlotB
    Properties:
      PublicKeyConfig:
        Name: !Sub aws-messaging-mcp-${Stage}-files-b
        CallerReference: !Sub aws-messaging-mcp-${Stage}-files-b-${FilesKeyFingerprint}
        EncodedKey: !Ref FilesPublicKeyPem

  SigningKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Condition: HasFilesKey
    Properties:
      KeyGroupConfig:
        Name: !Sub aws-messaging-mcp-${Stage}-files
        Items:
          - !If [UseKeySlotB, !Ref SigningPublicKeyB, !Ref SigningPublicKeyA]

  FilesCleanupScheduleRole:
    Type: AWS::IAM::Role
    Condition: HasFilesKey
    Properties:
      RoleName: !Sub aws-messaging-mcp-${Stage}-files-cleanup
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt McpFunction.Arn

  FilesCleanupSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: HasFilesKey
    Properties:
      Name: !Sub aws-messaging-mcp-${Stage}-files-cleanup
      ScheduleExpression: rate(1 day)
      FlexibleTimeWindow: { Mode: FLEXIBLE, MaximumWindowInMinutes: 60 }
      Target:
        Arn: !GetAtt McpFunction.Arn
        RoleArn: !GetAtt FilesCleanupScheduleRole.Arn
        Input: '{"task":"files-cleanup"}'

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub ${MediaBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: EumReadsMedia
            # End User Messaging fetches MediaUrls objects when sending MMS.
            Effect: Allow
            Principal: { Service: sms-voice.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${MediaBucket.Arn}/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  LogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Default SSE on CloudWatch Logs suffices (PRD S6 requires default encryption); logs carry no message bodies or tokens by design (PRD S5), and a CMK adds cost and key-policy surface for no threat-model gain here.
    Properties:
      LogGroupName: !Sub /aws/lambda/aws-messaging-mcp-${Stage}
      RetentionInDays: !If [IsProd, 90, 14]

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub aws-messaging-mcp-${Stage}-lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${LogGroup.Arn}:*
              - Sid: Secrets
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/messaging-mcp/${Stage}/*
              - Sid: SendEmail
                Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                # identity/* rather than the sending domain alone: SES also
                # authorizes SendEmail against the recipient's identity ARN for
                # sandbox sends to verified addresses. The FromAddress condition
                # is what actually pins who the server may send as.
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${SesConfigurationSet}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Split [",", !Ref SesSenderAddresses]
              - !If
                - HasEumPhone
                - Sid: SendSms
                  Effect: Allow
                  Action:
                    - sms-voice:SendTextMessage
                    - sms-voice:SendMediaMessage
                  Resource:
                    - !Ref OriginationPhoneArn
                    - !Sub arn:${AWS::Partition}:sms-voice:${AWS::Region}:${AWS::AccountId}:configuration-set/${EumConfigurationSet}
                - !Ref AWS::NoValue
              - Sid: EumRead
                Effect: Allow
                Action: sms-voice:DescribePhoneNumbers
                Resource: "*"
              - Sid: ReadEumEventTrail
                Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub ${EumEventsLogGroup.Arn}:*
              - Sid: StageMedia
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${MediaBucket.Arn}/mms/*
              - Sid: FilesObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                # files/shared/*: S3 keys carry the files/ prefix so the
                # bucket layout matches the public /files/* URI.
                Resource: !Sub ${FilesBucket.Arn}/files/shared/*
              - Sid: FilesList
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FilesBucket.Arn
              - Sid: FilesQuotaMetric
                Effect: Allow
                Action: cloudwatch:GetMetricData
                Resource: "*"
              - Sid: SesRead
                Effect: Allow
                Action:
                  - ses:ListEmailIdentities
                  - ses:GetAccount
                Resource: "*"
              - Sid: RateLimitCounters
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt RateLimitTable.Arn
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  McpFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: Reserved concurrency is parameterized (ReservedConcurrency) and disabled until the account's Lambda concurrency quota is raised - the small default quota cannot accommodate a reservation.
          - id: CKV_AWS_117
            comment: No VPC by design - the function only calls public AWS APIs; a VPC adds NAT cost and cold-start latency for nothing.
          - id: CKV_AWS_116
            comment: No DLQ - invocations are synchronous (Function URL); failures surface to the caller.
          - id: CKV_AWS_173
            comment: Environment variables hold no secrets (the origin secret is read from SSM at cold start); default encryption suffices.
          - id: CKV_AWS_272
            comment: Code signing deferred; artifacts are content-hash keyed in a private bucket written only by CI.
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: No VPC by design; see checkov CKV_AWS_117 justification.
    Properties:
      FunctionName: !Sub aws-messaging-mcp-${Stage}
      # Single static Go binary named bootstrap (cmd/server); no layer.
      Runtime: provided.al2023
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrency, !Ref AWS::NoValue]
      Role: !GetAtt ExecutionRole.Arn
      Handler: bootstrap
      Code:
        S3Bucket: !Sub aws-messaging-mcp-artifacts-${AWS::AccountId}
        S3Key: !Ref CodeKey
      TracingConfig: { Mode: Active }
      Environment:
        Variables:
          STAGE: !Ref Stage
          MCP_RESOURCE_URL: !If
            - IsProd
            - !Sub https://${DomainName}/mcp/
            - !Sub https://dev.${DomainName}/mcp/
          COGNITO_ISSUER: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
          COGNITO_DOMAIN: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
          ALLOWED_CLIENT_IDS: !If
            - IsDev
            - !Join [",", [!Ref ClaudeHostedClient, !Ref ClaudeCodeClient, !Ref CiClient]]
            - !Join [",", [!Ref ClaudeHostedClient, !Ref ClaudeCodeClient]]
          AUTH_METADATA_MODE: !Ref AuthMetadataMode
          REQUIRE_ORIGIN_SECRET: "true"
          ORIGIN_SECRET_PARAM: !Sub /messaging-mcp/${Stage}/origin-secret
          BREAK_GLASS_ENABLED: !Ref BreakGlassEnabled
          BREAK_GLASS_SHA256: !Ref BreakGlassSha256
          BREAK_GLASS_SCOPES: msg/read
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          SES_REPLY_TO: !Ref SesReplyTo
          OPT_IN_PHONE_NUMBER: !Ref OptInPhoneNumber
          EUM_CONFIGURATION_SET: !Ref EumConfigurationSet
          # The public opt-in page shows the same number the server sends from.
          ORIGINATION_IDENTITY: !Ref OptInPhoneNumber
          PROTECT_CONFIGURATION_ID: !Ref ProtectConfigurationId
          SMS_MAX_PRICE: !Ref SmsMaxPrice
          MEDIA_BUCKET: !Ref MediaBucket
          EUM_EVENTS_LOG_GROUP: !Sub /aws-messaging-mcp/${Stage}/eum-events
          FILES_BUCKET: !Ref FilesBucket
          FILES_KEY_PAIR_ID: !If [HasFilesKey, !If [UseKeySlotB, !Ref SigningPublicKeyB, !Ref SigningPublicKeyA], ""]
          FILES_SIGNING_KEY_PARAM: !Sub /messaging-mcp/${Stage}/files-signing-key
          FILES_MAX_EXPIRY_DAYS: !Ref FilesMaxExpiryDays
          FILES_MAX_UPLOAD_BYTES: !Ref FilesMaxUploadBytes
          FILES_QUOTA_BYTES: !Ref FilesQuotaBytes
          ALLOW_RISKY_CONTENT_TYPES: !If [IsDev, !Ref AllowRiskyContentTypes, "false"]
          SES_SENDER_ADDRESSES: !Ref SesSenderAddresses
          RECIPIENT_ALLOW_LIST: !Ref RecipientAllowList
          MAX_RECIPIENTS: !Ref MaxRecipients
          RATE_LIMIT_PER_HOUR: !Ref RateLimitPerHour
          RATE_LIMIT_PER_DAY: !Ref RateLimitPerDay
          EMAIL_MAX_RAW_BYTES: "10485760"
          RATE_LIMIT_TABLE: !Ref RateLimitTable

  McpFunctionUrl:
    Type: AWS::Lambda::Url
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_258
            comment: Deliberate PRD 4.2 design - IAM auth (OAC) on the URL would require x-amz-content-sha256, which MCP clients never send. The app rejects requests without the CloudFront-injected origin secret before any other work, and the URL hostname is never published.
    Properties:
      TargetFunctionArn: !Ref McpFunction
      AuthType: NONE
      InvokeMode: BUFFERED

  McpFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F13
            reason: AuthType NONE is the documented CloudFront-origin pattern (PRD 4.2) - OAC would require x-amz-content-sha256 which MCP clients do not send; the app rejects any request lacking the CloudFront-injected origin secret before token work.
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  McpFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: F13
            reason: Function URLs created after October 2025 require lambda:InvokeFunction alongside lambda:InvokeFunctionUrl for AuthType NONE; same origin-secret justification as McpFunctionUrlPermission.
    Properties:
      FunctionName: !Ref McpFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      # Restricts this grant to calls arriving via the function URL.
      InvokedViaFunctionUrl: true

  # Default-deny IP allow-list (PRD 4.1 step 2) as a viewer-request function:
  # the Free plan's WAF cannot express IP-set or path rules, and CloudFront
  # Functions are included. Signed-URL downloads under /files/* are exempt.
  IpAllowListFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub aws-messaging-mcp-${Stage}-ip-allowlist
      AutoPublish: true
      FunctionConfig:
        Comment: Allow listed IPv4 CIDRs everywhere; allow everyone under /files/, /, and /opt-in.
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var ALLOW = '${AllowedCidrs}'.split(',');
        function ip2int(ip) {
          var p = ip.split('.');
          if (p.length !== 4) return null;
          var n = 0;
          for (var i = 0; i < 4; i++) {
            var o = parseInt(p[i], 10);
            if (isNaN(o) || o < 0 || o > 255) return null;
            n = n * 256 + o;
          }
          return n;
        }
        function inCidr(ip, cidr) {
          var parts = cidr.trim().split('/');
          var base = ip2int(parts[0]);
          var addr = ip2int(ip);
          var bits = parts.length > 1 ? parseInt(parts[1], 10) : 32;
          if (base === null || addr === null || isNaN(bits)) return false;
          if (bits <= 0) return true;
          var block = Math.pow(2, 32 - bits);
          return Math.floor(addr / block) === Math.floor(base / block);
        }
        function handler(event) {
          var request = event.request;
          // Public paths: signed downloads, and the landing/opt-in pages the
          // toll-free verification reviewers must reach (PRD M3-5).
          if (request.uri.indexOf('/files/') === 0) return request;
          if (request.uri === '/' || request.uri === '/opt-in') return request;
          var ip = event.viewer.ip;
          for (var i = 0; i < ALLOW.length; i++) {
            if (ALLOW[i] && inCidr(ip, ALLOW[i])) return request;
          }
          return {
            statusCode: 403,
            statusDescription: 'Forbidden',
            headers: { 'content-type': { value: 'application/json' } },
            body: '{"error":"forbidden"}'
          };
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_86
            comment: Access logging deferred to M5 hardening with the rest of observability.
          - id: CKV2_AWS_32
            comment: Response-headers policy ships with the /files/* behavior in M4b; the M1 default behavior serves only the authenticated JSON API.
          - id: CKV_AWS_310
            comment: Single-origin API; origin failover does not apply.
          - id: CKV2_AWS_42
            comment: Custom SSL certificate IS configured via an SSM dynamic reference the scanner cannot resolve statically.
      cfn_nag:
        rules_to_suppress:
          - id: W10
            reason: Access logging deferred to M5 hardening.
          - id: W70
            reason: Minimum TLS 1.2 is set; the scanner cannot resolve the SSM dynamic reference for the certificate.
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub aws-messaging-mcp ${Stage}
        HttpVersion: http2and3
        # IPv4 only so the allow-list semantics are exact. No PriceClass: the
        # flat-rate plan forbids restricted price classes (default = all edges).
        IPV6Enabled: false
        # The (empty) web ACL exists for flat-rate plan eligibility; only the
        # prod distribution is subscribed, so only prod attaches it.
        WebACLId: !If [IsProd, "{{resolve:ssm:/messaging-mcp/edge/web-acl-arn}}", !Ref AWS::NoValue]
        Aliases:
          - !If [IsProd, !Ref DomainName, !Sub "dev.${DomainName}"]
        ViewerCertificate:
          AcmCertificateArn: "{{resolve:ssm:/messaging-mcp/edge/certificate-arn}}"
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: files-s3
            DomainName: !GetAtt FilesBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FilesOAC.Id
            S3OriginConfig: {}
          - Id: mcp-lambda
            DomainName: !Select [2, !Split ["/", !GetAtt McpFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Secret
                HeaderValue: !Ref OriginSecret
        CacheBehaviors: !If
          - HasFilesKey
          - - PathPattern: /files/*
              TargetOriginId: files-s3
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD]
              CachedMethods: [GET, HEAD]
              Compress: true
              TrustedKeyGroups: [!Ref SigningKeyGroup]
              # Managed CachingDisabled: delete-as-revoke (R9) must 403
              # immediately, and a cached object would keep serving after the
              # S3 delete. Per-request origin fetches are irrelevant at this
              # volume; the flat-rate plan's transfer bound is unchanged.
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              # Managed SecurityHeadersPolicy: the Free flat-rate plan rejects
              # CUSTOM response-headers policies (found by the v0.4.0 prod
              # deploy); nosniff/frame-deny come from the managed policy and
              # Cache-Control ships on the objects themselves.
              ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          TargetOriginId: mcp-lambda
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed policies: CachingDisabled + AllViewerExceptHostHeader.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IpAllowListFunction.FunctionMetadata.FunctionARN

  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: "{{resolve:ssm:/messaging-mcp/edge/hosted-zone-id}}"
      Name: !If [IsProd, !Ref DomainName, !Sub "dev.${DomainName}"]
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub aws-messaging-mcp-${Stage}-alarms
      KmsMasterKeyId: alias/aws/sns

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-messaging-mcp-${Stage}-lambda-errors
      AlarmDescription: Any Lambda error in a 5-minute window (PRD 13).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref McpFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-messaging-mcp-${Stage}-lambda-throttles
      AlarmDescription: Any Lambda throttle in a 5-minute window (PRD 13/S8).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - { Name: FunctionName, Value: !Ref McpFunction }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  DynamoThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub aws-messaging-mcp-${Stage}-ddb-throttles
      AlarmDescription: Rate-limit counter table throttling; guardrails fail closed when it errors.
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - { Name: TableName, Value: !Ref RateLimitTable }
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  # CloudFront metrics (5xx rate, BytesDownloaded) live only in us-east-1,
  # so they appear on the dashboard as cross-region widgets rather than as
  # alarms here (M5 finding); origin-side 5xx is covered by LambdaErrorsAlarm.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: IsProd
    Properties:
      Budget:
        BudgetName: aws-messaging-mcp-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: 10, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlarmEmail }

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub aws-messaging-mcp-${Stage}
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{
            "title":"Lambda invocations and errors","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Invocations","FunctionName","${McpFunction}"],
                       ["AWS/Lambda","Errors","FunctionName","${McpFunction}",{"color":"#d62728"}],
                       ["AWS/Lambda","Throttles","FunctionName","${McpFunction}",{"color":"#ff7f0e"}]]}},
          {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{
            "title":"Lambda duration p95 (ms)","region":"${AWS::Region}","stat":"p95","period":300,
            "metrics":[["AWS/Lambda","Duration","FunctionName","${McpFunction}"]]}},
          {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{
            "title":"Sends (SES account-level)","region":"${AWS::Region}","stat":"Sum","period":3600,
            "metrics":[["AWS/SES","Send"],["AWS/SES","Delivery"],["AWS/SES","Bounce",{"color":"#d62728"}]]}},
          {"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{
            "title":"CloudFront requests and 5xx (global)","region":"us-east-1","stat":"Sum","period":3600,
            "metrics":[["AWS/CloudFront","Requests","DistributionId","${Distribution}","Region","Global"],
                       ["AWS/CloudFront","5xxErrorRate","DistributionId","${Distribution}","Region","Global",{"stat":"Average","yAxis":"right","color":"#d62728"}]]}},
          {"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{
            "title":"Files transfer (bytes, global)","region":"us-east-1","stat":"Sum","period":86400,
            "metrics":[["AWS/CloudFront","BytesDownloaded","DistributionId","${Distribution}","Region","Global"]]}},
          {"type":"metric","x":16,"y":6,"width":8,"height":6,"properties":{
            "title":"Rate-limit table throttles","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/DynamoDB","ThrottledRequests","TableName","${RateLimitTable}"]]}}
        ]}

Outputs:
  McpUrl:
    Description: Canonical MCP endpoint for this stage.
    Value: !If [IsProd, !Sub "https://${DomainName}/mcp/", !Sub "https://dev.${DomainName}/mcp/"]
  UserPoolId:
    Value: !Ref UserPool
  HostedUiUrl:
    Description: Cognito hosted-UI base URL.
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  ClaudeHostedClientId:
    Description: Paste into the Claude Desktop / claude.ai custom connector.
    Value: !Ref ClaudeHostedClient
  ClaudeCodeClientId:
    Description: Use with claude mcp add --client-id.
    Value: !Ref ClaudeCodeClient
  DistributionId:
    Value: !Ref Distribution
  CiClientId:
    Condition: IsDev
    Description: Confidential CI client id for e2e (dev only).
    Value: !Ref CiClient
  FunctionUrl:
    Description: Raw Function URL (origin-secret protected); used by the release smoke test.
    Value: !GetAtt McpFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref McpFunction
